# Include this file inside Chronos's public HTTPS `server {}` block.
# The application remains the source of /robots.txt and all normal UI/API routes.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

# Reject common probe targets before they reach FastAPI or the SPA fallback.
location ~ (^|/)\. {
    return 404;
}

location ~* \.(env|ini|log|sql|bak|backup|old|swp|zip|tar|gz)$ {
    return 404;
}

# Local health checks are available only through the loopback-bound application port.
location = /api/health {
    return 404;
}

# Updater restore is a host-local callback, never a public API.
location = /api/internal/updater/restore {
    return 404;
}

# Compatibility alias remains host-local. The canonical Gryphon callback is
# /internal/gryphon/command on the Kernel-provided HTTPS origin; the application
# authenticates every callback with the service-specific token.
location = /api/internal/gryphon/command {
    return 404;
}

# FastAPI documentation is disabled in the app and denied again at the edge.
location = /docs { return 404; }
location ^~ /docs/ { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }
location = /swagger { return 404; }
location ^~ /swagger/ { return 404; }
location = /api-docs { return 404; }
location ^~ /api-docs/ { return 404; }
