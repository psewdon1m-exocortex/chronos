# Operator-managed nginx template. Replace CHRONOS_HOSTNAME and certificate paths.
# Add a separate fail-closed default server for unknown Host/SNI on the host.
server {
    listen 443 ssl;
    server_name CHRONOS_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/CHRONOS_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHRONOS_HOSTNAME/privkey.pem;
    client_max_body_size 1m;
    client_body_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ^~ /api/internal/ { return 404; }
    include /opt/exocortex/chronos/nginx.security.conf;
    location = /internal/gryphon/command {
        client_max_body_size 64k;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:18280;
    }
    location ~ ^/api/(admin/(restore|upload/|articles/import)|backup/restore|updates/apply) {
        client_max_body_size 192m;
        # Set a bounded client_body_temp_path/quota in the server-wide nginx config.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:18280;
    }
    location / { proxy_pass http://127.0.0.1:18280; }
}
