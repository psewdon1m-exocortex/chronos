name: chronos-development

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: "${CHRONOS_DB_PASSWORD:-development-password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - chronos-db:/var/lib/postgresql/data

  chronos:
    build: .
    env_file: .env
    environment:
      CHRONOS_COOKIE_SECURE: "false"
      DATABASE_URL: "postgresql://chronos:${CHRONOS_DB_PASSWORD:-development-password}@db:5432/chronos"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18280:18280"
    volumes:
      - chronos-data:/app/data

volumes:
  chronos-db:
  chronos-data:
